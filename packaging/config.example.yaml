# Configuration de PCIA Control Center
#
# Emplacement attendu : /etc/pcia-control-center/config.yaml
# Toutes les clés sont facultatives : les valeurs ci-dessous sont les valeurs
# par défaut. Les variables d'environnement PCIA_* sont prioritaires.
#
# Les clés acceptent le snake_case (ci-dessous) comme le camelCase.

server:
  # 0.0.0.0 : joignable depuis le réseau local. 127.0.0.1 pour restreindre à la machine.
  host: 0.0.0.0
  port: 4321
  # Origines autorisées en CORS — utile uniquement pour le serveur de dev Vite.
  cors_origins: []
  # Répertoire du front-end compilé. Détecté automatiquement s'il est absent.
  # static_dir: /opt/pcia-control-center/dist

mode:
  # hardware : mesures réelles uniquement.
  # demo     : tout est simulé (et annoncé comme tel dans l'interface).
  # auto     : matériel si /sys/class/hwmon est lisible, sinon démonstration.
  type: auto
  demo_gtx_installed: true

storage:
  database_path: /var/lib/pcia-control-center/pcia.db
  runtime_dir: /run/pcia-control-center

history:
  # Rétention des mesures détaillées. L'interface affiche une fenêtre de 60 min.
  retention_hours: 24
  sample_interval_ms: 10000
  purge_interval_ms: 900000

collector:
  sensors_interval_ms: 2000
  power_interval_ms: 4000
  storage_interval_ms: 20000
  services_interval_ms: 10000
  connections_interval_ms: 10000
  inventory_interval_ms: 60000

fan_control:
  loop_interval_ms: 1000

  # Consigne appliquée quand un capteur de référence devient illisible.
  sensor_failure_pwm: 80
  # Consigne appliquée quand la perte de capteur se prolonge, ou en situation critique.
  critical_pwm: 100
  sensor_grace_ms: 15000

  # ATTENTION — sécurité.
  # `true` (recommandé) : une sortie ne passe sous contrôle logiciel au démarrage
  # que si le retour au BIOS a été confirmé par la calibration. Passer à `false`
  # signifie accepter qu'après un arrêt du service, les ventilateurs puissent
  # rester figés sur leur dernière consigne. Voir « Limites connues » du README.
  require_bios_return_validation: true

  # Détection de ventilateur bloqué : les trois conditions doivent être réunies.
  stall:
    pwm_threshold: 30       # consigne minimale pour que 0 RPM soit anormal
    delay_ms: 10000         # durée minimale de la condition
    consecutive_reads: 3    # lectures consécutives à 0 RPM

  max_write_failures: 3

  # Plancher imposé aux sorties refroidissant du matériel passif (Tesla V100).
  # Ces cartes n'ont pas de ventilateur intégré : elles ne doivent jamais se
  # retrouver sans flux d'air.
  passive_gpu_floor_pwm: 35

  heartbeat_interval_ms: 2000
  heartbeat_timeout_ms: 8000
  # Consigne appliquée juste avant la restitution au BIOS lors d'un arrêt propre.
  shutdown_pwm: 70

  # Moteur embarqué dans le serveur web :
  #   auto   : seulement si aucun daemon pcia-fand ne détient le verrou ;
  #   always : déploiement mono-processus (sans systemd) ;
  #   never  : le daemon est obligatoire.
  #
  # La configuration LIVRÉE impose `never` : en production, pcia-fan-control.service
  # est l'unique moteur de ventilation, et le serveur web le pilote par IPC via
  # /run/pcia-control-center/fand.sock. Aucun FanHost embarqué n'est démarré par
  # le serveur web, donc aucune course possible sur fan-engine.lock.
  #
  # Le défaut logiciel du code reste `auto`, utile hors systemd : développement,
  # mode démonstration, exécution mono-processus. `always` ne se justifie que pour
  # un déploiement mono-processus volontaire, sans daemon.
  #
  # Après une mise à jour depuis une ancienne version, un config.yaml existant
  # contenant `embedded: auto` doit être passé à `never` pour un déploiement
  # systemd standard (le script d'installation ne modifie jamais votre config).
  embedded: never

# ---------------------------------------------------------------------
# Mappage « sortie logique ↔ matériel »
# ---------------------------------------------------------------------
# Facultatif. Sans cette section, chaque sortie reste associée au matériel par
# l'assistant de calibration uniquement — comportement des versions précédentes.
#
# Ce que cette section fait :   désigner quel `pwmN` et quel `fanN_input`
#                               correspondent à chaque connecteur physique.
# Ce qu'elle ne fait PAS :      autoriser le contrôle logiciel. Une sortie reste
#                               pilotée par le BIOS tant que la calibration n'a
#                               pas vérifié la sortie ET le retour au BIOS.
#
# Pour connaître les valeurs à écrire ici, sur la machine concernée :
#     node /opt/pcia-control-center/dist-server/server/src/cli.js discover
# La commande est en lecture seule : elle n'écrit aucun pwm.
#
# N'écrivez JAMAIS un numéro hwmon (hwmon3…) comme identifiant : il est attribué
# dans l'ordre de sondage des pilotes et change d'un démarrage à l'autre.
# Désignez le contrôleur par `name`, `driver`, `bus`, `address` ou `key`.
#
# fans:
#   mapping:
#     CPU_FAN1:
#       label: CPU_FAN1              # nom sérigraphié sur la carte mère
#       controller: { name: nct6798 } # /sys/class/hwmon/hwmonN/name
#       pwm: 1                        # pwm1
#       tach: 1                       # fan1_input ; `null` = pas de tachymètre
#     SYS_FAN1:
#       label: SYS_FAN1
#       controller: { name: nct6798 }
#       pwm: 2
#       tach: 2
#     SYS_FAN2:
#       label: SYS_FAN2
#       controller: { name: nct6798 }
#       pwm: 3
#       tach: 3
#     SYS_FAN3:                       # refroidissement Tesla V100 n°1
#       label: SYS_FAN3
#       controller: { name: nct6798, address: nct6775.2592 }
#       pwm: 4
#       tach: 4
#     SYS_FAN4:                       # refroidissement Tesla V100 n°2
#       label: SYS_FAN4
#       # Variante « chemin explicite » : le segment hwmonN est neutralisé à la
#       # résolution, seul le device sous-jacent est comparé.
#       pwm_path: /sys/devices/platform/nct6775.2592/hwmon/hwmon2/pwm5
#       tach_path: /sys/devices/platform/nct6775.2592/hwmon/hwmon2/fan5_input
#
# Une entrée qui ne se résout pas est signalée dans les journaux et par la
# commande `discover`, jamais fatale : la ventilation ne doit pas s'arrêter à
# cause d'un fichier de configuration.

calibration:
  identify_step_seconds: 6
  identify_low_pwm: 70
  identify_high_pwm: 100
  minimum_step_seconds: 6
  minimum_decrement: 5
  minimum_safety_margin: 10
  bios_return_observe_seconds: 12
  # Toute calibration est interrompue au-delà de cette température.
  abort_temperature_c: 85

alerts:
  # Seuils [attention, critique] par composant, en °C.
  temperature_thresholds:
    cpu: [75, 88]
    nvme: [60, 72]
    v100-1: [80, 88]
    v100-2: [80, 88]
    gtx1080: [78, 88]
    motherboard: [55, 65]
    case-front: [45, 55]
    case-rear: [48, 58]
  # Température de référence déclenchant une consigne 100 % immédiate.
  critical_temperature_c: 90

security:
  # Refuse les requêtes provenant d'adresses non privées.
  # Ne jamais passer à `false` sur une machine exposée à Internet.
  lan_only: true
  # none  : réseau local de confiance, aucune authentification.
  # token : jeton partagé exigé pour les actions sensibles.
  auth_mode: none
  # token: "changez-moi"
  # Permet de désactiver globalement calibration, écriture PWM, import, etc.
  allow_sensitive_actions: true

logging:
  level: info      # debug | info | warn | error
  format: json     # json (journald) | text
